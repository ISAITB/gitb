@if (reportSettings) {
    <form>
        <div class="row">
            <label class="col-3 col-form-label text-end">* Report file name:</label>
            <div class="col-8 col-md-6">
                <div class="row row-cols-auto align-items-center gx-3">
                    <div class="col-auto">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="checkbox" [attr.id]="idValueCustomiseFileName" [name]="idValueCustomiseFileName" [(ngModel)]="customiseFileName" (change)="onCustomiseFileNameChange()">
                            <label class="form-check-label" [attr.for]="idValueCustomiseFileName">Customise?</label>
                        </div>
                    </div>
                    <div class="col-auto flex-grow-1">
                        <app-report-file-name-expression [reportType]="reportType()" [value]="customiseFileName ? reportSettings!.fileNameExpression : reportSettings!.defaultFileNameExpression" (valueChange)="reportSettings!.fileNameExpression = $event" [readonly]="!customiseFileName"></app-report-file-name-expression>
                    </div>
                </div>
            </div>
            <div app-tooltip class="col-auto" tbTooltip="The naming expression used to define the report's file name."></div>
        </div>
        <div class="row mt-3 pt-1">
            <legend class="col-3 col-form-label text-end pt-0">PDF signatures:</legend>
            <div class="col-8 col-md-6">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" [attr.id]="idValueSign" [name]="idValueSign" [(ngModel)]="reportSettings!.signPdfs">
                    <label class="form-check-label" [attr.for]="idValueSign">Add signature to reports
                        <div class="col-auto d-inline-flex" app-tooltip [inline]="true" inlineType="checkLabelText" tbTooltip="Add a digital signature and timestamp to PDF reports as proof of authenticity."></div>
                    </label>
                </div>
            </div>
        </div>
        <div class="btn-toolbar mt-3">
            <button class="btn btn-secondary" [labelIcon]="Constants.BUTTON_ICON.SAVE" type="submit" (click)="update()" [disable]="previewPending || !updateEnabled()" [pending]="updatePending">Update</button>
            <button class="btn btn-secondary" [labelIcon]="Constants.BUTTON_ICON.PREVIEW" type="button" (click)="preview()" [disable]="updatePending || !updateEnabled()" [pending]="previewPending">Generate preview</button>
            <button class="btn btn-secondary" [labelIcon]="Constants.BUTTON_ICON.SIGNATURE" (click)="manageKeystore()" [pending]="manageKeystorePending">Manage signature settings</button>
        </div>
    </form>
}
