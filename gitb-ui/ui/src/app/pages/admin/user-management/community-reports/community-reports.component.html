<div class="page">
    <div class="card">
        <div class="card-header">
            <div class="card-title">Report settings</div>
            <div app-community-tag-indicator></div>
        </div>
        <div class="configsContainer">
            <div class="configContainer">
                <!-- Conformance statement certificate -->
                <app-configuration-entry
                    #conformanceStatementCertificateEntry
                    configTitle="Conformance statement certificate"
                    configDescription="Certificate produced for a specific conformance statement that is successfully completed."
                    [(status)]="conformanceStatementCertificateSettings.status"
                    (beforeExpand)="conformanceStatementCertificateSettings.setExpanding()"
                    (afterExpand)="conformanceStatementCertificateSettings.setExpanded()">
                    <app-conformance-certificate-form
                        [communityId]="communityId"
                        [selected]="conformanceStatementCertificateSettings.expanding"
                        [expanded]="conformanceStatementCertificateSettings.expanded"
                        (loaded)="conformanceStatementCertificateSettings.setLoaded(conformanceStatementCertificateEntry)"
                        (collapse)="conformanceStatementCertificateSettings.setCollapsed()"></app-conformance-certificate-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Conformance overview certificate -->
                <app-configuration-entry
                    #conformanceOverviewEntry
                    configTitle="Conformance overview certificate"
                    configDescription="Certificate produced for multiple conformance statements once all have successfully completed."
                    [(status)]="conformanceOverviewCertificateSettings.status"
                    (beforeExpand)="conformanceOverviewCertificateSettings.setExpanding()"
                    (afterExpand)="conformanceOverviewCertificateSettings.setExpanded()">
                    <app-conformance-overview-certificate-form
                        [communityId]="communityId"
                        [selected]="conformanceOverviewCertificateSettings.expanding"
                        [expanded]="conformanceOverviewCertificateSettings.expanded"
                        (loaded)="conformanceOverviewCertificateSettings.setLoaded(conformanceOverviewEntry)"
                        (collapse)="conformanceOverviewCertificateSettings.setCollapsed()"></app-conformance-overview-certificate-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Conformance statement report -->
                <app-configuration-entry
                    #conformanceStatementReportEntry
                    configTitle="Conformance statement report"
                    configDescription="Report summarising the status of a specific conformance statement."
                    [(status)]="conformanceStatementReportSettings.status"
                    (beforeExpand)="conformanceStatementReportSettings.setExpanding()"
                    (afterExpand)="conformanceStatementReportSettings.setExpanded()">
                <app-conformance-statement-report-form
                    [communityId]="communityId"
                    [selected]="conformanceStatementReportSettings.expanding"
                    [expanded]="conformanceStatementReportSettings.expanded"
                    (loaded)="conformanceStatementReportSettings.setLoaded(conformanceStatementReportEntry)"
                    (collapse)="conformanceStatementReportSettings.setCollapsed()"></app-conformance-statement-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Conformance overview report -->
                <app-configuration-entry
                    #conformanceOverviewReportEntry
                    configTitle="Conformance overview report"
                    configDescription="Report summarising the status of multiple conformance statements."
                    [(status)]="conformanceOverviewReportSettings.status"
                    (beforeExpand)="conformanceOverviewReportSettings.setExpanding()"
                    (afterExpand)="conformanceOverviewReportSettings.setExpanded()">
                    <app-conformance-overview-report-form
                        [communityId]="communityId"
                        [selected]="conformanceOverviewReportSettings.expanding"
                        [expanded]="conformanceOverviewReportSettings.expanded"
                        (loaded)="conformanceOverviewReportSettings.setLoaded(conformanceOverviewReportEntry)"
                        (collapse)="conformanceOverviewReportSettings.setCollapsed()"></app-conformance-overview-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Conformance statement documentation report -->
                <app-configuration-entry
                    #conformanceStatementDocumentationReportEntry
                    configTitle="Conformance statement documentation"
                    configDescription="Report summarising all documentation linked to a specific conformance statement."
                    [(status)]="conformanceStatementDocumentationReportSettings.status"
                    (beforeExpand)="conformanceStatementDocumentationReportSettings.setExpanding()"
                    (afterExpand)="conformanceStatementDocumentationReportSettings.setExpanded()">
                    <app-conformance-statement-documentation-report-form
                        [communityId]="communityId"
                        [selected]="conformanceStatementDocumentationReportSettings.expanding"
                        [expanded]="conformanceStatementDocumentationReportSettings.expanded"
                        (loaded)="conformanceStatementDocumentationReportSettings.setLoaded(conformanceStatementDocumentationReportEntry)"
                        (collapse)="conformanceStatementDocumentationReportSettings.setCollapsed()"></app-conformance-statement-documentation-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Test suite documentation report -->
                <app-configuration-entry
                    #testSuiteDocumentationReportEntry
                    configTitle="Test suite documentation"
                    configDescription="Report including the documentation related to a specific test suite."
                    [(status)]="testSuiteDocumentationReportSettings.status"
                    (beforeExpand)="testSuiteDocumentationReportSettings.setExpanding()"
                    (afterExpand)="testSuiteDocumentationReportSettings.setExpanded()">
                    <app-test-suite-documentation-report-form
                        [communityId]="communityId"
                        [selected]="testSuiteDocumentationReportSettings.expanding"
                        [expanded]="testSuiteDocumentationReportSettings.expanded"
                        (loaded)="testSuiteDocumentationReportSettings.setLoaded(testSuiteDocumentationReportEntry)"
                        (collapse)="testSuiteDocumentationReportSettings.setCollapsed()"></app-test-suite-documentation-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Test case documentation report -->
                <app-configuration-entry
                    #testCaseDocumentationReportEntry
                    configTitle="Test case documentation"
                    configDescription="Report including the documentation related to a specific test case."
                    [(status)]="testCaseDocumentationReportSettings.status"
                    (beforeExpand)="testCaseDocumentationReportSettings.setExpanding()"
                    (afterExpand)="testCaseDocumentationReportSettings.setExpanded()">
                    <app-test-case-documentation-report-form
                        [communityId]="communityId"
                        [selected]="testCaseDocumentationReportSettings.expanding"
                        [expanded]="testCaseDocumentationReportSettings.expanded"
                        (loaded)="testCaseDocumentationReportSettings.setLoaded(testCaseDocumentationReportEntry)"
                        (collapse)="testCaseDocumentationReportSettings.setCollapsed()"></app-test-case-documentation-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Test case report -->
                <app-configuration-entry
                    #testCaseReportEntry
                    configTitle="Test case report"
                    configDescription="Report providing details on the result of a test session execution."
                    [(status)]="testCaseReportSettings.status"
                    (beforeExpand)="testCaseReportSettings.setExpanding()"
                    (afterExpand)="testCaseReportSettings.setExpanded()">
                    <app-test-case-report-form
                        [communityId]="communityId"
                        [selected]="testCaseReportSettings.expanding"
                        [expanded]="testCaseReportSettings.expanded"
                        (loaded)="testCaseReportSettings.setLoaded(testCaseReportEntry)"
                        (collapse)="testCaseReportSettings.setCollapsed()"></app-test-case-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Test step report -->
                <app-configuration-entry
                    #testStepReportEntry
                    configTitle="Test step report"
                    configDescription="Report summarising the results of a specific test case step."
                    [(status)]="testStepReportSettings.status"
                    (beforeExpand)="testStepReportSettings.setExpanding()"
                    (afterExpand)="testStepReportSettings.setExpanded()">
                    <app-test-step-report-form
                        [communityId]="communityId"
                        [selected]="testStepReportSettings.expanding"
                        [expanded]="testStepReportSettings.expanded"
                        (loaded)="testStepReportSettings.setLoaded(testStepReportEntry)"
                        (collapse)="testStepReportSettings.setCollapsed()"></app-test-step-report-form>
                </app-configuration-entry>
            </div>
            <div class="configContainer">
                <!-- Test data archive -->
                <app-configuration-entry
                    #testDataArchiveEntry
                    configTitle="Test data archive"
                    configDescription="Archive containing all data related to a specific test session."
                    [(status)]="testDataArchiveSettings.status"
                    (beforeExpand)="testDataArchiveSettings.setExpanding()"
                    (afterExpand)="testDataArchiveSettings.setExpanded()">
                    <app-test-data-archive-report-form
                        [communityId]="communityId"
                        [selected]="testDataArchiveSettings.expanding"
                        [expanded]="testDataArchiveSettings.expanded"
                        (loaded)="testDataArchiveSettings.setLoaded(testDataArchiveEntry)"
                        (collapse)="testDataArchiveSettings.setCollapsed()"></app-test-data-archive-report-form>
                </app-configuration-entry>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-secondary" [labelIcon]="Constants.BUTTON_ICON.BACK"  type="button" (click)="back()">Back</button>
        </div>
    </div>
</div>
