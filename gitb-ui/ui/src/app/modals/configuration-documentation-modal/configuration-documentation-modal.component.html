<div class="modal-header">
    <div tabindex="-1" class="modal-focus-anchor" ngbAutofocus></div>
    <div class="modal-title">Configuration documentation</div>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-12">
            <div class="alert alert-info rounded">
                <span>This documentation is displayed in configuration management forms as an information box.</span>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <app-editor name="documentationContent" [(ngModel)]="content" [type]="'minimal'" [height]="300"></app-editor>
        </div>
    </div>
</div>
<div class="modal-footer button-container">
    @if (hasExistingDocumentation()) {
        <div class="btn-toolbar btn-toolbar-delete">
            <button class="btn btn-outline-danger" [labelIcon]="Constants.BUTTON_ICON.DELETE" type="button" (click)="delete()" [disable]="savePending" [pending]="deletePending">Delete</button>
        </div>
    }
    <div class="btn-toolbar">
        <button [labelIcon]="Constants.BUTTON_ICON.CANCEL" class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
        <button [labelIcon]="Constants.BUTTON_ICON.SAVE" [pending]="savePending" [disable]="!saveEnabled()" class="btn btn-secondary" type="button" (click)="save()">Save</button>
    </div>
</div>
