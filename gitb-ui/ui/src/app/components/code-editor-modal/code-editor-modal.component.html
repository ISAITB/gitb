<div class="modal-header">
	<div class="modal-title">{{isNameVisible?documentName:"Data"}}</div>
</div>
<div class="modal-body">
    <app-alert-display [alerts]="alerts"></app-alert-display>
	<div class="editor" [ngClass]="styleClass">
		<app-code-editor #codeEditor [(ngModel)]="editorOptions.value" [options]="editorOptions"></app-code-editor>
	</div>
</div>
<div class="modal-footer">
    <div tabindex="-1" class="modal-focus-anchor" ngbAutofocus></div>
	<div class="btn-toolbar">
		<button type="button" [labelIcon]="Constants.BUTTON_ICON.CANCEL" class="btn btn-secondary" (click)="close()">Close</button>
		@if (isPrettyPrintVisible) {
			@if (prettyPrinted) {
				<button type="button" [labelIcon]="Constants.BUTTON_ICON.PRETTY_PRINT" class="btn btn-secondary" (click)="togglePrettyPrint()">Show original</button>
			} @else {
				<button type="button" [labelIcon]="Constants.BUTTON_ICON.PRETTY_PRINT" class="btn btn-secondary" (click)="togglePrettyPrint()">Pretty-print</button>
			}
		}
		@if (isCopyVisible) {
			<button type="button" [labelIcon]="Constants.BUTTON_ICON.CLIPBOARD" class="btn btn-secondary" (click)="copyToClipboard()">Copy to clipboard</button>
		}
		@if (isDownloadVisible) {
			<button type="button" [labelIcon]="Constants.BUTTON_ICON.DOWNLOAD" class="btn btn-secondary" (click)="download()">Download</button>
		}
	</div>
</div>
