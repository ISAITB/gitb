<div class="notification" [ngClass]="displayed.type"
     (mouseenter)="mouseEntering()"
     (mouseleave)="mouseLeaving()"
     (click)="closeNotification()"
     [class.removing]="removing">
    <div class="icon">
        <span class="fa-stack">
            <i class="fa-solid fa-circle background-icon fa-stack-2x"></i>
            @switch (displayed.type) {
                @case ('error') {
                    <i class="fa-solid fa-xmark foreground-icon fa-stack-1x"></i>
                }
                @case ('warning') {
                    <i class="fa-solid fa-exclamation foreground-icon fa-stack-1x"></i>
                }
                @case ('success') {
                    <i class="fa-solid fa-check foreground-icon fa-stack-1x"></i>
                }
                @default {
                    <i class="fa-solid fa-info foreground-icon fa-stack-1x"></i>
                }
            }
        </span>
    </div>
    <div class="message" [class.swapping]="swapping">
        @if (displayed.action) {
            @if (displayed.action.target) {
                <a class="message-action plain-link"
                   [navTarget]="displayed.action.target"
                   (click)="actionClicked($event)"
                   (auxclick)="actionAuxClicked($event)">
                    <ng-container *ngTemplateOutlet="content"></ng-container>
                </a>
            } @else {
                <a class="message-action plain-link" role="button" tabindex="0"
                   (click)="actionClicked($event)"
                   (auxclick)="actionAuxClicked($event)">
                    <ng-container *ngTemplateOutlet="content"></ng-container>
                </a>
            }
        } @else {
            <ng-container *ngTemplateOutlet="content"></ng-container>
        }
    </div>
    <div class="close">
        <span><i [class]="Constants.BUTTON_ICON.CANCEL"></i></span>
    </div>
</div>
<ng-template #content>
    @if (displayed.subtitle != undefined) {
        <div>{{ displayed.message }}</div>
        <div class="notification-subtitle">{{ displayed.subtitle }}</div>
    } @else {
        <div [innerHTML]="displayed.message"></div>
    }
</ng-template>
