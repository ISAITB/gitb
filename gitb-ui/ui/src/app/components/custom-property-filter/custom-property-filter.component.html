<div class="custom-property-filter" [class.embedded]="embedded">
    @if (applied) {
        <app-pill [title]="appliedName" [text]="appliedValueLabel!" [shaded]="!embedded" [actionIcon]="Constants.BUTTON_ICON.CANCEL" actionTooltip="Remove" (action)="clear()"></app-pill>
    } @else {
      <div class="custom-property-filter-container non-applied">
        <div class="property-id">
          <select name="propInput" (change)="propertyChanged()" [(ngModel)]="propertyInfo.property" class="form-select">
              @for (prop of properties; track prop.id) {
                <option [ngValue]="prop">{{prop.name}}</option>
              }
          </select>
        </div>
        @if (!propertyInfo || !propertyInfo.property || !propertyInfo.property.allowedValues) {
          <div class="property-value">
            <input name="valInput" [(ngModel)]="propertyInfo.value" type="text" class="form-control"/>
          </div>
        } @else if (propertyInfo.property.presetValues) {
          <div class="property-value">
            <select name="valInputChoice" [(ngModel)]="propertyInfo.valueObj" class="form-select">
                @for (v of propertyInfo.property!.presetValues; track $index) {
                  <option [ngValue]="v">{{v.label}}</option>
                }
            </select>
          </div>
        }
        <div class="property-controls">
          <button class="btn btn-secondary" (click)="apply()" tooltipClass="shortTooltip" ngbTooltip="Apply" [openDelay]="Constants.TOOLTIP_DELAY" [triggers]="'mouseover:mouseout'" container="body">
              <span><i [class]="Constants.BUTTON_ICON.CONFIRM"></i></span>
          </button>
          <button class="btn btn-secondary" (click)="cancel()" tooltipClass="shortTooltip" ngbTooltip="Cancel" [openDelay]="Constants.TOOLTIP_DELAY" [triggers]="'mouseover:mouseout'" container="body">
              <span><i [class]="Constants.BUTTON_ICON.CANCEL"></i></span>
          </button>
        </div>
      </div>
    }
  </div>
