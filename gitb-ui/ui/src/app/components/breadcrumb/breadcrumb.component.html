@if (dataService.showNavigationControls) {
    <div class="breacrumbContainer" [class.disable-events]="logoutInProgress">
        @if (breadcrumbs != undefined) {
            @for (crumb of breadcrumbsToShow; track $index) {
                @if (crumb.label != undefined) {
                    @if (!$first) {
                        <div class="breacrumbItemSeparator"><i class="fa-solid fa-angle-right"></i></div>
                    }
                    @if (crumb.target) {
                        <a class="breacrumbItem actionable plain-link"
                            #popup="ngbTooltip"
                            (mouseover)="mouseOver($event)"
                            [tooltipClass]="'shortTooltip'"
                            placement="bottom"
                            [ngbTooltip]="crumb.label"
                            [openDelay]="Constants.TOOLTIP_DELAY"
                            [disableTooltip]="!hasOverflow"
                            [navTarget]="crumb.target"
                            (click)="popup.close();breadcrumbClicked($event)"
                        >{{crumb.label}}</a>
                    } @else {
                        <div class="breacrumbItem"
                            #popup="ngbTooltip"
                            (mouseover)="mouseOver($event)"
                            [tooltipClass]="'shortTooltip'"
                            placement="bottom"
                            [ngbTooltip]="crumb.label"
                            [openDelay]="Constants.TOOLTIP_DELAY"
                            [disableTooltip]="!hasOverflow"
                            (click)="popup.close()"
                        >{{crumb.label}}</div>
                    }
                }
            }
        }
    </div>
}
