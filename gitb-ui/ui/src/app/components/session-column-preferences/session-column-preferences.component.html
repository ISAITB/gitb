<div class="d-flex flex-wrap align-items-center column-gap-3 row-gap-1">
    @for (option of options; track option.key) {
        <div class="form-check form-check-inline mb-0">
            <input class="form-check-input" type="checkbox"
                   [id]="'col-' + columnCase + '-' + option.key"
                   [name]="'col-' + columnCase + '-' + option.key"
                   [checked]="option.default"
                   [class.is-invalid]="optionInvalid(option)"
                   (change)="toggle(option, $any($event.target).checked)">
            <label class="form-check-label" [for]="'col-' + columnCase + '-' + option.key">{{option.label}}</label>
        </div>
    }
    @if (tooltip) {
        <div app-tooltip [inline]="true" inlineType="checkLabelText" [tbTooltip]="tooltip"></div>
    }
</div>
@if (errorMessage) {
    <div class="invalid-feedback d-block">{{errorMessage}}</div>
}
