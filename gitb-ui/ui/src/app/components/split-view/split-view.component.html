<div #primaryArea class="split-view-primary" [class.shaded]="topShaded" [style.height.px]="enabled && sized ? primaryHeight : null">
    <ng-content select="[splitViewPrimary]"></ng-content>
</div>
@if (enabled) {
    <div #divider class="split-view-divider" (mousedown)="onDividerMouseDown($event)">
        <div class="split-view-divider-top"></div>
        <div class="split-view-divider-bottom" [class.shaded]="bottomShaded"></div>
    </div>
}
<div #secondaryArea class="split-view-secondary" [class.shaded]="bottomShaded" [style.min-height.px]="enabled && sized ? secondaryHeight : null">
    <ng-content select="[splitViewSecondary]"></ng-content>
</div>
