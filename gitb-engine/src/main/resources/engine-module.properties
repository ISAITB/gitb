gitb.engine.iteration-limit = 1000
# The following value determines where messaging handler callbacks will be made.
# This is meant for development purposes. This address needs to be publicly accessible
# considering that any messaging handler should be able to make a callback, not only
# ones running on the same network as the test bed. This is why for production purposes
# this value should always be provided either as a system property or as an environment
# variable.
gitb.defaultCallbackURL = http://localhost:8080/itbsrv/
# Messaging properties
gitb.messaging.start-port = 8081
gitb.messaging.end-port = 9080
gitb.messaging.actor-name = gitb-test-engine-messaging-server
gitb.messaging.server-ip-address = 127.0.0.1
# The maximum time (in ms) an incoming HTTP/SOAP call for which no receive step is (yet) parked is held before
# being rejected. This avoids a race whereby a system under test calls back before the corresponding receive
# step has been reached. Set to 0 to reject such calls immediately (previous behaviour).
gitb.engine.callbacks.wait-timeout = 30000
# The maximum number of incoming calls that may be held concurrently (across all sessions) while awaiting a
# matching receive step, to bound the associated memory use.
gitb.engine.callbacks.wait-limit = 1000
# The root folder used for temporary, always-present working storage (as opposed to gitb.engine.storage.location
# above, which is for the optional persistence of large session data values). Sub-folders are created under this
# as needed.
gitb.engine.temp.location = ./temp/
# Whether the request payload of a held incoming HTTP/SOAP call (see gitb.engine.callbacks.wait-timeout) is
# spilled to disk rather than kept in memory for the duration it is held. This avoids pinning heap for large
# payloads while a burst of early calls is parked awaiting their receive steps.
gitb.engine.callbacks.storage.enabled = true
# Where held incoming call payloads are written to when the above is enabled. Defaults to a sub-folder of
# gitb.engine.temp.location.
gitb.engine.callbacks.storage.location = ./temp/callback-data/
# Test case repository
remote.testcase.test-id.parameter = test_id
remote.testcase.resource-id.parameter = resource_id
remote.testcase.repository.url = http://gitb-ui:9000/api/repository/tests/:test_id/definition
remote.testresource.repository.url = http://gitb-ui:9000/api/repository/resource/:test_id/:resource_id