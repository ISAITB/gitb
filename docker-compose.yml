volumes:
   gitb-repo:
   gitb-dbdata:

services:
   gitb-redis:
      build:
        context: ./etc/docker/gitb-redis
      restart: unless-stopped
   gitb-mysql:
      build:
        context: ./etc/docker/gitb-mysql
        args:
         MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
         MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      restart: unless-stopped
      volumes:
       - gitb-dbdata:/var/lib/mysql
      healthcheck:
       test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
       interval: 3s
       retries: 10
   gitb-srv:
      build:
        context: ./
        dockerfile: etc/docker/build/Dockerfile-srv
        args:
         HMAC_KEY: ${HMAC_KEY:-}
      restart: unless-stopped
      environment:
       - CALLBACK_ROOT_URL=http://localhost:8080/itbsrv
      ports:
       - "8080:8080"
   gitb-ui:
      build:
        context: ./
        dockerfile: etc/docker/build/Dockerfile-ui
        args:
         APPLICATION_SECRET: ${APPLICATION_SECRET:-}
         HMAC_KEY: ${HMAC_KEY:-}
         MASTER_PASSWORD: ${MASTER_PASSWORD:-}
         DB_DEFAULT_PASSWORD: ${DB_DEFAULT_PASSWORD:-}
      restart: unless-stopped
      ports:
       - "9000:9000"
      volumes:
       - gitb-repo:/gitb-repository
      depends_on:
       gitb-redis:
         condition: service_started
       gitb-mysql:
         condition: service_healthy
       gitb-srv:
         condition: service_started 