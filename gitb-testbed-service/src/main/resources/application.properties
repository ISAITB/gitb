# The context path of the application.
server.servlet.context-path=/itbsrv
#
# Multipart file upload configuration properties.
#
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.file-size-threshold=0B
# Disable log banner
spring.main.banner-mode=off
# Make sure that Tomcat's limit to the maximum number of multipart request parts does not block us.
server.tomcat.max-parameter-count=10000
server.tomcat.max-part-count=100