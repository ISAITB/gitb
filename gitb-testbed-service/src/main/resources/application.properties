# The context path of the application.
server.servlet.context-path=/itbsrv
#
# Multipart file upload configuration properties.
#
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.file-size-threshold=0B
# Disable log banner
spring.main.banner-mode=off
# Make sure that Tomcat's limit to the maximum number of multipart request parts does not block us.
server.tomcat.max-parameter-count=10000
server.tomcat.max-part-count=100
# Disable Spring MVC's own async request timeout for HttpMessagingServer/SoapMessagingServer's async responses.
# These are governed instead by the engine's own gitb.engine.callbacks.wait-timeout setting, which always
# completes the underlying future - a competing (and by default shorter) MVC-level timeout would otherwise
# surface as an unexpected 503 instead of the intended 404.
spring.mvc.async.request-timeout=-1